[package]
name = "migrate-mongo"
version = "0.1.0"
edition = "2024"
description = "One-shot data migration from MCIM MongoDB to PostgreSQL"
publish = false

[dependencies]
anyhow = "1"
bson = { version = "3", features = ["chrono-0_4", "serde", "serde_json-1"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
mcim-rust-api = { path = "../.." }
mongodb = { version = "3.3", features = ["bson-3"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
