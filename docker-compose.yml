services:
  postgres:
    container_name: postgres
    image: postgres:18
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: mcim
      POSTGRES_PASSWORD: example
      POSTGRES_DB: mcim_backend
    volumes:
      - /data/postgres:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - 6379:6379
    restart: always
    volumes: 
      - ./config/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M

  mcim-rust-api:
    container_name: mcim-rust-api
    image: z0z0r4/mcim-rust-api:latest
    ports:
      - 8080:8080
    restart: always
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://mcim:example@postgres:5432/mcim_backend"
      REDIS_URL: "redis://redis:6379"
      CURSEFORGE_API_URL: "https://api.curseforge.com"
      MODRINTH_API_URL: "https://api.modrinth.com"
      CURSEFORGE_API_KEY: "your_curseforge_api_key"
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 300M
