[workspace]
members = [".", "tools/migrate-mongo"]

[package]
name = "mcim-rust-api"
version = "0.1.0"
edition = "2024"
authors = ["z0z0r4@outlook.com"]
description = "MCIM API rewritten in Rust"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
utoipa = { version = "5.4.0", features = ["actix_extras", "chrono"] }
utoipa-actix-web = "0.1.2"
utoipauto = "=0.3.0-alpha.2"
actix-service = "2.0.3"
futures-util = "0.3.31"
bytes = "1.10.1"
md5 = "0.8.0"
reqwest = { version = "0.12.24", features = ["json"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4"
urlencoding = "2.1.3"
actix-middleware-etag = "0.4.6"
actix-web-prom = "0.10.0"
redis = { version = "0.32.7", features = ["tokio-comp"] }
prometheus = "0.14.0"
rand = "0.9.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "macros", "migrate"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
